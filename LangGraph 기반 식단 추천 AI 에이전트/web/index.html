<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>식단 추천 상담</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="phone-top">
      <button class="icon-btn" type="button" aria-label="뒤로">‹</button>
      <div>
        <h1>식단 추천 상담</h1>
        <p>개인 맞춤 식단 추천</p>
      </div>
      <button class="icon-btn" type="button" aria-label="메뉴">☰</button>
    </header>

    <section class="brand-bar">
      <strong>식단 추천 에이전트</strong>
      <span>현재 상태 기반 추천</span>
    </section>

    <main id="chat" class="chat">
      <div id="dateLine" class="date-line"></div>

      <div class="message bot">
        <div class="bubble intro">
          <p><strong>안녕하세요.</strong><br>현재 상태를 바탕으로 식단을 추천해드리겠습니다.</p>
          <p class="small">먼저 기본 정보를 입력해주십시오.</p>
        </div>
      </div>

      <section class="profile-card">
        <h2>기본 정보</h2>
        <form id="profileForm">
          <label>
            성별
            <select id="gender">
              <option value="남자">남자</option>
              <option value="여자">여자</option>
            </select>
          </label>

          <div class="triple">
            <label>
              나이
              <input id="age" type="number" value="24" min="1">
            </label>
            <label>
              키(cm)
              <input id="height" type="number" value="173" min="80">
            </label>
            <label>
              몸무게(kg)
              <input id="weight" type="number" value="72" min="20">
            </label>
          </div>

          <label>
            알레르기 / 피해야 할 재료
            <input id="avoid" type="text" placeholder="예: 새우,땅콩">
          </label>
        </form>
      </section>

      <section class="quick-card">
        <h2>빠른 질문</h2>
        <p>아래 버튼을 누르면 바로 상담을 시작할 수 있어요.</p>
        <div class="quick-grid">
          <button type="button" data-question="오늘 활동량이 적고 점심에 국밥 먹어서 저녁은 나트륨 낮게 추천">활동량 적은 날</button>
          <button type="button" data-question="전에 먹은 김밥 말고 당류 낮은 아침 추천">당류 낮은 아침</button>
          <button type="button" data-question="저녁으로 먹기 좋은 도시락 추천">저녁 도시락</button>
          <button type="button" data-question="단백질 보충에 좋은 점심 추천">단백질 점심</button>
        </div>
      </section>
    </main>

    <form id="chatForm" class="composer">
      <button type="button" class="plus-btn" aria-label="추가">+</button>
      <input id="messageInput" type="text" placeholder="궁금한 내용을 입력해주세요.">
      <button type="submit" class="send-btn">전송</button>
    </form>
  </div>

  <script src="app.js"></script>
</body>
</html>
