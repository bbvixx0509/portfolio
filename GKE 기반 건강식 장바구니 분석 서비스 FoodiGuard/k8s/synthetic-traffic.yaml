# 관측용 합성 트래픽. 실사용자가 없는 동안 지표가 비지 않게 낮은 부하를 계속 흘린다.
#
# 초당 1~2건으로 잡았다. 높이면 DB(1 vCPU)가 계속 포화돼 24시간 내내 경보가 울리고,
# 정작 보려는 "평상시에 안정적인가"를 못 본다. 알림 발동 확인은 별도로 부하를 올려서 한다.
#
# 검색어는 매칭 건수가 다른 것을 섞었다. 빠른 경로(희귀어)와 느린 경로(흔한 어)가
# 함께 찍혀야 p95 가 한쪽으로 치우치지 않는다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: foodiguard-synthetic-traffic
  labels:
    app: foodiguard-synthetic-traffic
spec:
  replicas: 1
  selector:
    matchLabels:
      app: foodiguard-synthetic-traffic
  template:
    metadata:
      labels:
        app: foodiguard-synthetic-traffic
    spec:
      containers:
        - name: traffic
          image: BACKEND_IMAGE_PLACEHOLDER
          command: ["node", "-e"]
          args:
            - |
              const BASE = 'http://foodiguard-api.default.svc.cluster.local';
              // 흔한 어(전수 스캔)와 희귀어(인덱스)를 섞는다.
              const QUERIES = ['면', '우유', '냉면', '비빔면', '초코파이', '두부'];
              const paths = () => [
                '/api/products?display=48',
                '/api/products?display=48&theme=sodium',
                '/api/products?display=48&excludeAllergens=' + encodeURIComponent('메밀'),
                '/api/products?display=48&query=' + encodeURIComponent(QUERIES[Math.floor(Math.random() * QUERIES.length)]),
              ];
              const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
              let sent = 0, failed = 0;
              (async () => {
                for (;;) {
                  for (const path of paths()) {
                    try {
                      const res = await fetch(BASE + path);
                      await res.text();
                      if (!res.ok) failed += 1;
                    } catch { failed += 1; }
                    sent += 1;
                    await sleep(600);
                  }
                  if (sent % 100 < 4) console.log(new Date().toISOString(), 'sent', sent, 'failed', failed);
                }
              })();
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
