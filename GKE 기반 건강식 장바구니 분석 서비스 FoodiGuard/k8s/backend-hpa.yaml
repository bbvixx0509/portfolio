apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: foodiguard-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: foodiguard-api
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: ContainerResource
      containerResource:
        name: cpu
        container: foodiguard-api
        target:
          type: Utilization
          averageUtilization: 65
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
