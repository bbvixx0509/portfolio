apiVersion: apps/v1
kind: Deployment
metadata:
  name: foodiguard-web
  labels:
    app: foodiguard-web
spec:
  replicas: 2
  minReadySeconds: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: foodiguard-web
  template:
    metadata:
      labels:
        app: foodiguard-web
    spec:
      terminationGracePeriodSeconds: 60
      topologySpreadConstraints:
        - maxSkew: 1
          minDomains: 2
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: foodiguard-web
      containers:
        - name: foodiguard-web
          image: IMAGE_PLACEHOLDER
          imagePullPolicy: Always
          lifecycle:
            preStop:
              exec:
                # Allow the LB health check to drain this node before nginx exits.
                command: ["/bin/sh", "-c", "sleep 30; nginx -s quit; sleep 5"]
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
