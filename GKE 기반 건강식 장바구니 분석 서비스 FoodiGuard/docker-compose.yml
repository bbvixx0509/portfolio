services:
  db:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:-foodiguard}
      POSTGRES_DB: foodiguard
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d foodiguard"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  api:
    build: ./backend
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: foodiguard
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:-foodiguard}
      PORT: 8080
      LOCAL_PGLITE: "false"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  migrate:
    build: ./backend
    command: ["npm", "run", "db:migrate"]
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: foodiguard
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:-foodiguard}
      LOCAL_PGLITE: "false"
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  web:
    build: .
    environment:
      API_UPSTREAM: http://api:8080
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  db-data:
